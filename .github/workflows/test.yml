name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-20.04", "windows-latest"]
        python: ["3.8.1", "3.8", "3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install poetry
        uses: snok/install-poetry@v1.3
        with:
          version: 1.8.2

      - name: Add poetry to path
        run: echo "${HOME}/.local/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      - name: Install code and dev dependencies
        run: |
          poetry install
          # I think isort's colorama detection might be broken, because without
          # this I got Python exceptions for name 'colorama' not found,
          # suggesting that one bit of code conditionally imported it, then
          # another bit unconditionally used it.
          poetry run pip install colorama
          poetry run pip freeze

      - name: Lint
        run: |
          poetry run isort . --check-only
          poetry run flake8 .
          poetry run mypy .

      - name: Test
        run: poetry run pytest -m"not inaccessible" --cov=omnidiff --cov-branch --cov-report=xml --cov-report=term

      - name: Build wheel
        run: poetry build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          env_vars: OS,PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}
