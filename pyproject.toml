[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "omnidiff"
version = "0.0.1"
description = "A Python library for managing collections of files."
readme = "README.rst"
authors = ["Steve Jessop <68118527+sjjessop@users.noreply.github.com>"]
license = "MIT"
homepage = "https://github.com/sjjessop/omnidiff"
packages = [{ include = "omnidiff" }]

[tool.poetry.dependencies]
python = ">=3.8.1"

click = ">=8.1.7"
pytest = ">=8.1.1"
tqdm = ">=4.66.2"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0"
isort = ">5.13.2"
mypy = ">=1.9.0"
pytest-cov = ">=4.1.0"
pygments = ">=2.17.1"
setuptools = ">=69.1.1"
sphinx = ">=7.1.2"
types-tqdm = ">=4.66.0.20240106"
wheel = ">= 0.42.0"

[tool.poetry.scripts]
omnidiff = 'omnidiff.command_line:main'


[tool.isort]
force_sort_within_sections = true
lines_after_imports=1
multi_line_output = "VERTICAL_GRID_GROUPED"
include_trailing_comma = true
src_paths = ["omnidiff"]
known_first_party = ["omnidiff"]


[tool.mypy]
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "pytest.fail\\(",
]


[tool.pytest.ini_options]
filterwarnings = ["error"]
addopts = "--strict-markers"
markers = [
    "inaccessible: marks tests requiring inaccessible OS files.",
]
